<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690"><rect width="1000" height="690" rx="24" fill="#101b35"/><g font-family="Arial,sans-serif" fill="#eef4ff"><text x="40" y="46" font-size="17" fill="#a8c6ff" letter-spacing="2">IDT / GST RETURNS / SECTION 37(3)</text><text x="40" y="90" font-size="32" font-weight="bold">GSTR-1: last date for rectification</text><rect x="40" y="116" width="920" height="116" rx="14" fill="#20365e"/><text x="62" y="148" font-size="19" font-weight="bold">Question</text><text x="62" y="180" font-size="19">Invoice details included in GSTR-1 for August 2023 contain an error.</text><text x="62" y="207" font-size="19">Error noticed on 1 December 2023. What is the last date to rectify?</text><g font-size="18"><rect x="40" y="259" width="280" height="87" rx="12" fill="#2b4477"/><text x="180" y="290" text-anchor="middle" font-weight="bold">August 2023</text><text x="180" y="320" text-anchor="middle">Original return</text><path d="M324 302H354" stroke="#a8c6ff" stroke-width="3"/><path d="M348 295L358 302L348 309" fill="none" stroke="#a8c6ff" stroke-width="3"/><rect x="360" y="259" width="280" height="87" rx="12" fill="#2b4477"/><text x="500" y="290" text-anchor="middle" font-weight="bold">31 March 2024</text><text x="500" y="320" text-anchor="middle">End of FY 2023-24</text><path d="M644 302H674" stroke="#a8c6ff" stroke-width="3"/><path d="M668 295L678 302L668 309" fill="none" stroke="#a8c6ff" stroke-width="3"/><rect x="680" y="259" width="280" height="87" rx="12" fill="#17634f"/><text x="820" y="290" text-anchor="middle" font-weight="bold">30 November 2024</text><text x="820" y="320" text-anchor="middle">Statutory outer date</text></g><rect x="40" y="372" width="920" height="125" rx="14" fill="#263b68"/><text x="62" y="403" font-size="20" font-weight="bold">Legal rule: earlier of</text><text x="62" y="435" font-size="19">1. 30 November following the relevant financial year; or</text><text x="62" y="465" font-size="19">2. Actual date of furnishing the relevant annual return.</text><rect x="40" y="517" width="920" height="67" rx="12" fill="#513b28"/><text x="62" y="544" font-size="18" font-weight="bold" fill="#ffdb9e">Exam trap</text><text x="62" y="568" font-size="18">The discovery date (1 December 2023) does not determine the cutoff.</text><text x="40" y="625" font-size="25" font-weight="bold" fill="#9fe8c4">Answer: 30 November 2024*</text><text x="40" y="654" font-size="16" fill="#b8c9e4">*Assuming the FY 2023-24 annual return was not furnished earlier.</text></g></svg>