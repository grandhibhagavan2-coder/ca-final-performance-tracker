<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040"><rect width="1000" height="1040" rx="24" fill="#0e1729"/><g font-family="Arial,sans-serif" fill="#eef3ff"><text x="45" y="48" font-size="19" fill="#93aaff">IDT / GST REGISTRATION / MISTAKE 001</text><text x="45" y="92" font-size="34" font-weight="bold">RCM: Which registration rule wins?</text><rect x="45" y="120" width="910" height="105" rx="15" fill="#22314c"/><text x="65" y="155" font-size="23" font-weight="bold">XYZ Associates • Maharashtra • Advocates • ₹18 lakh turnover</text><text x="65" y="193" font-size="22">Receives services on which it must pay GST under RCM.</text><rect x="45" y="250" width="440" height="115" rx="15" fill="#22314c"/><rect x="515" y="250" width="440" height="115" rx="15" fill="#22314c"/><text x="65" y="282" font-size="22" font-weight="bold">OUTWARD: legal services</text><text x="65" y="315" font-size="20">XYZ → Business client</text><text x="65" y="344" font-size="19">Client pays GST (if taxable under RCM)</text><text x="535" y="282" font-size="22" font-weight="bold">INWARD: RCM services</text><text x="535" y="315" font-size="20">Service provider → XYZ</text><text x="535" y="344" font-size="19">XYZ is liable to pay GST</text><g text-anchor="middle"><rect x="180" y="393" width="640" height="83" rx="13" fill="#28374f"/><text x="500" y="423" font-size="23" font-weight="bold">Section 22(1) • ₹18L &lt; ₹20L</text><text x="500" y="453" font-size="20">No threshold-based registration</text><text x="500" y="505" font-size="27">↓</text><rect x="180" y="515" width="640" height="83" rx="13" fill="#633747"/><text x="500" y="546" font-size="23" font-weight="bold">Section 24(iii) • Inward RCM</text><text x="500" y="575" font-size="20">Compulsory registration, prima facie</text><text x="500" y="627" font-size="27">↓</text><rect x="75" y="637" width="850" height="116" rx="13" fill="#314b78"/><text x="500" y="670" font-size="23" font-weight="bold">Section 23(2) + Notification 5/2017–CT</text><text x="500" y="701" font-size="20">Overrides Sections 22(1) and 24</text><text x="500" y="730" font-size="19">Check exclusive outward taxable supplies covered by Section 9(3) RCM.</text><text x="500" y="781" font-size="27">↓</text><rect x="45" y="790" width="910" height="96" rx="14" fill="#185344"/><text x="500" y="825" font-size="26" font-weight="bold">If notification applies: registration not required.</text><text x="500" y="857" font-size="20">If it does not apply: Section 24(iii) requires registration.</text></g><text x="45" y="923" font-size="20" fill="#ffb7b7" font-weight="bold">Mistake: stopping at Section 24 without checking Section 23(2).</text><text x="45" y="952" font-size="18">Assumption: all outward supplies meet the notification conditions; client details are not given.</text><text x="45" y="980" font-size="18">Registration exemption is not a tax exemption. Do not infer that inward RCM tax disappears.</text><text x="45" y="1010" font-size="17" fill="#aebcda">References: CGST Act ss. 22–24; Notifications 5/2017–CT and 13/2017–CT(Rate).</text></g></svg>