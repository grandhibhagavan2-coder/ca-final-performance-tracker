<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CA Final | Mistake Ledger</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui}main{max-width:1060px;margin:auto;padding:32px 20px}h1{font-size:clamp(32px,5vw,56px);margin:10px 0}p{color:#b7c4db;line-height:1.5}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #374766;background:#17233c;color:#fff}button{cursor:pointer}button.active{background:#4959bb}input{width:100%}article{background:#131e33;border:1px solid #35425f;border-radius:18px;padding:20px;margin:18px 0}small{color:#aebcda}img{width:100%;height:auto;border-radius:12px}.empty{padding:30px;text-align:center;color:#aebcda}a{color:#a8baff}</style><main><small>MISSION / MAY 2027</small><h1>Mistake Ledger</h1><p>Capture the trap. Correct the reasoning. Never repeat it.</p><nav class="tabs" id="tabs"></nav><input id="search" placeholder="Search chapter, section or mistake"><div id="cards"></div><p><small>Study notes are public on this repository. Do not upload personal or confidential material.</small></p></main><script>const subjects=['All','FR','AFM','Audit','DT','IDT','IBS'];let selected='All';const entries=[{subject:'IDT',chapter:'GST • Registration',title:'RCM and overriding registration exemption',image:'mistakes/idt/registration-001.svg',tags:'Section 22 23 24 notification 5/2017 XYZ Associates'}];const tabs=document.getElementById('tabs'),cards=document.getElementById('cards'),search=document.getElementById('search');function render(){tabs.replaceChildren();subjects.forEach(s=>{let b=document.createElement('button');b.textContent=s;b.className=s===selected?'active':'';b.onclick=()=>{selected=s;render()};tabs.append(b)});cards.replaceChildren();const list=entries.filter(e=>(selected==='All'||e.subject===selected)&&Object.values(e).join(' ').toLowerCase().includes(search.value.toLowerCase()));for(const e of list){const a=document.createElement('article');const label=document.createElement('small');label.textContent=e.subject+' / '+e.chapter;const h=document.createElement('h2');h.textContent=e.title;const img=document.createElement('img');img.src=e.image;img.alt=e.title;const link=document.createElement('a');link.href=e.image;link.textContent='Open full-size chart';a.append(label,h,img,link);cards.append(a)}if(!list.length){cards.textContent='No mistakes recorded in this subject yet.';cards.className='empty'}else cards.className=''}search.oninput=render;render();</script></html>
