<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CA Final | Mistake Ledger</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui}main{max-width:1060px;margin:auto;padding:32px 20px}h1{font-size:clamp(32px,5vw,56px);margin:10px 0}p{color:#b7c4db;line-height:1.5}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #374766;background:#17233c;color:#fff}button{cursor:pointer}button.active{background:#4959bb}input{width:100%}article{background:#131e33;border:1px solid #35425f;border-radius:18px;padding:20px;margin:18px 0}small{color:#aebcda}img{width:100%;height:auto;border-radius:12px}.empty{padding:30px;text-align:center;color:#aebcda}a{color:#a8baff}body{background:#f1f5f9;color:#18243b}main{max-width:1200px}p,small{color:#536680}h1{color:#15264a}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:15px}.tabs button{min-height:112px;background:white;color:#23365a;border:1px solid #dbe3ef;box-shadow:0 3px 12px #162c5510;font-weight:700;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.tabs button.active{background:#254a96;color:white;border-color:#254a96}.tabs button small{font-size:12px;color:inherit;font-weight:400}input{background:white;color:#18243b;border-color:#cbd5e1}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}article{background:white;border:1px solid #dbe3ef;box-shadow:0 3px 12px #162c5510;margin:0;cursor:pointer}article h2{font-size:20px;color:#172c50}article img{display:none}article.open img{display:block;margin:15px 0}article a{color:#254a96;display:inline-block;margin-top:12px}article .hint{color:#536680;font-size:14px}article.open{grid-column:1/-1}article.open img{max-width:850px} .empty{color:#536680}#cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));margin-top:18px;align-items:start}article{min-height:145px;padding:18px;transition:transform .15s,box-shadow .15s}article:hover{transform:translateY(-3px);box-shadow:0 8px 22px #162c5520}article h2{font-size:18px;margin:12px 0}article:focus-visible{outline:3px solid #6488dc}dialog{width:min(760px,92vw);max-height:88dvh;padding:0;border:1px solid #dbe3ef;border-radius:18px;background:white;color:#18243b;box-shadow:0 25px 90px #14213e55;overflow:hidden}dialog::backdrop{background:#111c35aa;backdrop-filter:blur(3px)}.modal-head{padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #dbe3ef}.modal-head h2{font-size:18px;margin:0}.modal-body{padding:16px;max-height:calc(88dvh - 76px);overflow:auto;text-align:center}.modal-body img{display:block;width:auto;max-width:100%;max-height:68dvh;margin:auto;object-fit:contain}.modal-body a{display:inline-block;margin:12px;color:#254a96}.close{background:#edf1f8;color:#18243b;border:0;min-width:42px;font-size:22px;padding:7px}body:has(dialog[open]){overflow:hidden}</style><main><small>MISSION / MAY 2027</small><h1>Mistake Ledger</h1><p>Capture the trap. Correct the reasoning. Never repeat it.</p><nav class="tabs" id="tabs"></nav><input id="search" placeholder="Search chapter, section or mistake"><div id="cards"></div><p><small>Study notes are public on this repository. Do not upload personal or confidential material.</small></p></main><dialog id="caseModal" aria-labelledby="caseTitle"><div class="modal-head"><h2 id="caseTitle"></h2><button class="close" id="closeCase" aria-label="Close chart">×</button></div><div class="modal-body"><img id="caseImage" alt=""><a id="caseLink" target="_blank" rel="noopener">Open original chart ↗</a></div></dialog><script>const subjects=['All','FR','AFM','Audit','DT','IDT','IBS'];let selected='All';const entries=[{subject:'IDT',chapter:'GST • Registration',title:'RCM and overriding registration exemption',image:'mistakes/idt/registration-001.svg',tags:'Section 22 23 24 notification 5/2017 XYZ Associates'}];const modal=document.getElementById('caseModal');document.getElementById('closeCase').onclick=()=>modal.close();modal.addEventListener('click',ev=>{if(ev.target===modal){const r=modal.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)modal.close()}});function showCase(e){document.getElementById('caseTitle').textContent=e.title;const im=document.getElementById('caseImage');im.src=e.image;im.alt=e.title;document.getElementById('caseLink').href=e.image;modal.showModal()}const tabs=document.getElementById('tabs'),cards=document.getElementById('cards'),search=document.getElementById('search');function render(){tabs.replaceChildren();subjects.forEach(s=>{let b=document.createElement('button');b.textContent=s==='All'?'All subjects':s;const sub=document.createElement('small');sub.textContent=entries.filter(e=>s==='All'||e.subject===s).length+' recorded';b.append(sub);b.className=s===selected?'active':'';b.onclick=()=>{selected=s;render()};tabs.append(b)});cards.replaceChildren();const list=entries.filter(e=>(selected==='All'||e.subject===selected)&&Object.values(e).join(' ').toLowerCase().includes(search.value.toLowerCase()));for(const e of list){const a=document.createElement('article');const label=document.createElement('small');label.textContent=e.subject+' / '+e.chapter;const h=document.createElement('h2');h.textContent=e.title;const hint=document.createElement('div');hint.className='hint';hint.textContent='View case ↗';a.tabIndex=0;a.setAttribute('role','button');a.setAttribute('aria-haspopup','dialog');a.onclick=()=>showCase(e);a.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();showCase(e)}};a.append(label,h,hint);cards.append(a)}if(!list.length){cards.textContent='No mistakes recorded in this subject yet.';cards.className='empty'}else cards.className=''}search.oninput=render;render();</script></html>
