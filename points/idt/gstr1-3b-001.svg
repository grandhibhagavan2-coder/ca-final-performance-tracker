<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650"><rect width="1200" height="1650" rx="24" fill="#eef3fa"/><g font-family="Arial,sans-serif" fill="#182b48"><text x="45" y="48" font-size="20" fill="#365a9a">IDT / POINTS TO UNDERSTAND / 001</text><text x="45" y="98" font-size="40" font-weight="bold">Why GSTR-1 liability can exceed GSTR-3B</text><text x="45" y="132" font-size="23">Five cases • Rule 88C • DRC-01B • ITC trap</text><rect x="45" y="160" width="1110" height="174" rx="14" fill="white" stroke="#cad8ec"/><rect x="45" y="160" width="9" height="174" rx="4" fill="#365a9a"/><text x="70" y="194" font-size="27" font-weight="bold">01 / Earlier invoice reported late</text><text x="70" y="232" font-size="23">October: GSTR-1 nil | GSTR-3B ₹18,000</text><text x="70" y="265" font-size="23">November: GSTR-1 ₹18,000 | GSTR-3B nil</text><text x="70" y="303" font-size="22" fill="#365a9a">GST already paid in October; reconcile the timing difference.</text><rect x="45" y="352" width="1110" height="174" rx="14" fill="white" stroke="#cad8ec"/><rect x="45" y="352" width="9" height="174" rx="4" fill="#365a9a"/><text x="70" y="386" font-size="27" font-weight="bold">02 / Excess liability in earlier month</text><text x="70" y="424" font-size="23">October: GSTR-1 ₹80,000 | GSTR-3B ₹1,00,000</text><text x="70" y="457" font-size="23">November: GSTR-1 ₹1,50,000 | GSTR-3B ₹1,30,000</text><text x="70" y="495" font-size="22" fill="#365a9a">₹20,000 adjustment, where legally permissible; retain reconciliation.</text><rect x="45" y="544" width="1110" height="174" rx="14" fill="white" stroke="#cad8ec"/><rect x="45" y="544" width="9" height="174" rx="4" fill="#365a9a"/><text x="70" y="578" font-size="27" font-weight="bold">03 / Duplicate invoice</text><text x="70" y="616" font-size="23">Actual GST ₹18,000 | GSTR-1 ₹36,000</text><text x="70" y="649" font-size="23">Correct GSTR-3B liability ₹18,000 | Difference ₹18,000</text><text x="70" y="687" font-size="22" fill="#365a9a">Correct the duplicate reporting through the available amendment route.</text><rect x="45" y="736" width="1110" height="174" rx="14" fill="white" stroke="#cad8ec"/><rect x="45" y="736" width="9" height="174" rx="4" fill="#365a9a"/><text x="70" y="770" font-size="27" font-weight="bold">04 / Incorrect rate reported</text><text x="70" y="808" font-size="23">Taxable value ₹1,00,000 | Actual rate 5% | GST ₹5,000</text><text x="70" y="841" font-size="23">GSTR-1 rate 18% | GST ₹18,000 | Difference ₹13,000</text><text x="70" y="879" font-size="22" fill="#365a9a">Correct the reporting error; use GSTR-1A where available.</text><rect x="45" y="928" width="1110" height="174" rx="14" fill="white" stroke="#cad8ec"/><rect x="45" y="928" width="9" height="174" rx="4" fill="#b74444"/><text x="70" y="962" font-size="27" font-weight="bold">05 / Actual short payment</text><text x="70" y="1000" font-size="23">GSTR-1 ₹1,80,000 | GSTR-3B ₹1,20,000</text><text x="70" y="1033" font-size="23">Short payment ₹60,000</text><text x="70" y="1071" font-size="22" fill="#365a9a">Pay differential tax and applicable interest.</text><rect x="45" y="1125" width="1110" height="245" rx="14" fill="#203e73"/><g fill="white"><text x="70" y="1165" font-size="29" font-weight="bold">Rule 88C: mismatch above system threshold</text><text x="70" y="1205" font-size="24">GSTR-1 / GSTR-1A / IFF &gt; GSTR-3B → DRC-01B Part A</text><text x="70" y="1243" font-size="24">Within 7 days: pay tax + interest via DRC-03, or explain difference.</text><text x="70" y="1281" font-size="24">Submit payment details / explanation in DRC-01B Part B.</text><text x="70" y="1320" font-size="22">Failure to respond may block subsequent GSTR-1/IFF (Rule 59(6)(d)).</text></g><rect x="45" y="1390" width="1110" height="205" rx="14" fill="#e1f2e9" stroke="#9ac9ad"/><text x="70" y="1430" font-size="29" font-weight="bold" fill="#17583c">Exam trap: ITC does not create a liability mismatch</text><text x="70" y="1470" font-size="24">GSTR-1 ₹1,00,000 = GSTR-3B ₹1,00,000</text><text x="70" y="1508" font-size="24">ITC utilised ₹70,000 + cash ₹30,000 → difference NIL.</text><text x="70" y="1550" font-size="24" font-weight="bold">Compare liability with liability, not liability with cash payment.</text><text x="45" y="1630" font-size="19">Illustrative figures; prior chat converted into a revision chart. Check applicable amendment rules.</text></g></svg>