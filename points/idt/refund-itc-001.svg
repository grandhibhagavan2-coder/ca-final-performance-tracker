<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><rect width="1000" height="1050" rx="24" fill="#101c32"/><g font-family="Arial,sans-serif" fill="#edf3ff"><text x="45" y="54" font-size="19" fill="#9bbcff">WHITE ROOM / IDT / GST REFUNDS</text><text x="45" y="108" font-size="36" font-weight="bold">Refund of unutilised ITC</text><text x="45" y="148" font-size="24" fill="#9bbcff">Section 54(3) • Two permitted grounds</text><rect x="40" y="185" width="920" height="305" rx="18" fill="#203653"/><text x="65" y="230" font-size="28" font-weight="bold">01  Zero-rated supplies without payment of tax</text><text x="65" y="265" font-size="22" fill="#9bbcff">Section 54(3)(i) / Rule 89(4)</text><text x="65" y="310" font-size="24">Inputs: ₹5,00,000 × 18% = ₹90,000 ITC</text><text x="65" y="351" font-size="24">Export under LUT: ₹8,00,000; output tax = NIL</text><text x="65" y="397" font-size="26" font-weight="bold" fill="#83e8b6">Potential refund: ₹90,000*</text><text x="65" y="449" font-size="21">Logic: no output tax on these supplies to absorb the credit.</text><rect x="40" y="510" width="920" height="305" rx="18" fill="#203653"/><text x="65" y="555" font-size="28" font-weight="bold">02  Inverted duty structure</text><text x="65" y="590" font-size="22" fill="#9bbcff">Section 54(3)(ii) / Rule 89(5)</text><text x="65" y="635" font-size="24">Inputs: ₹10,00,000 × 18% = ₹1,80,000 ITC</text><text x="65" y="676" font-size="24">Output: ₹12,00,000 × 5% = ₹60,000 tax</text><text x="65" y="722" font-size="26" font-weight="bold" fill="#83e8b6">Potential refund: ₹1,20,000*</text><text x="65" y="775" font-size="21">Logic: higher input tax rate causes credit accumulation.</text><rect x="40" y="835" width="920" height="177" rx="18" fill="#493b29"/><text x="65" y="874" font-size="24" font-weight="bold" fill="#ffda8c">EXAM TRAPS</text><text x="65" y="908" font-size="21">Mere accumulation is not enough. Nil-rated or fully exempt</text><text x="65" y="937" font-size="21">outputs and notified exclusions do not qualify under inversion.</text><text x="65" y="974" font-size="18">*Illustrative, subject to prescribed formula, eligibility and restrictions.</text></g></svg>