<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1163" viewBox="0 0 800 1163"><rect width="800" height="1163" fill="#0b1020"/><g font-family="Arial,sans-serif"><rect x="24" y="35" width="752" height="99" rx="16" fill="#17233c" stroke="#425476"/><text x="46" y="71" font-size="25" font-weight="700" fill="#9fc6ff">DEEMED EXPORTS</text><text x="46" y="107" font-size="19" fill="#edf2ff">Recipient refund • No double benefit</text><rect x="24" y="148" width="752" height="99" rx="16" fill="#17233c" stroke="#425476"/><text x="46" y="184" font-size="25" font-weight="700" fill="#9fc6ff">01 • Pay GST</text><text x="46" y="220" font-size="19" fill="#edf2ff">Bank ₹50,000 → ₹32,000; ITC ₹0 → ₹18,000</text><rect x="24" y="261" width="752" height="99" rx="16" fill="#17233c" stroke="#425476"/><text x="46" y="297" font-size="25" font-weight="700" fill="#9fc6ff">02 • Apply for refund</text><text x="46" y="333" font-size="19" fill="#edf2ff">Debit ITC ₹18,000; refund receivable ₹18,000</text><rect x="24" y="374" width="752" height="99" rx="16" fill="#17233c" stroke="#425476"/><text x="46" y="410" font-size="25" font-weight="700" fill="#9fc6ff">03 • Receive refund</text><text x="46" y="446" font-size="19" fill="#edf2ff">Bank ₹32,000 → ₹50,000; ITC remains NIL</text><rect x="24" y="487" width="752" height="167" rx="16" fill="#17233c" stroke="#425476"/><text x="46" y="523" font-size="25" font-weight="700" fill="#9fc6ff">Journal entries (GST portion only)</text><text x="46" y="559" font-size="19" fill="#edf2ff">Input GST Dr 18,000 / To Bank 18,000</text><text x="46" y="593" font-size="19" fill="#edf2ff">Refund receivable Dr 18,000 / To Input GST 18,000</text><text x="46" y="627" font-size="19" fill="#edf2ff">Bank Dr 18,000 / To Refund receivable 18,000</text><rect x="24" y="668" width="752" height="133" rx="16" fill="#17233c" stroke="#425476"/><text x="46" y="704" font-size="25" font-weight="700" fill="#9fc6ff">EXAM TRAP</text><text x="46" y="740" font-size="19" fill="#edf2ff">−18,000 +18,000 −18,000 +18,000 = ZERO</text><text x="46" y="774" font-size="19" fill="#edf2ff">ITC is surrendered, not retained alongside cash.</text><rect x="24" y="815" width="752" height="201" rx="16" fill="#17233c" stroke="#425476"/><text x="46" y="851" font-size="25" font-weight="700" fill="#9fc6ff">Special credit • Circular 172/04/2022-GST</text><text x="46" y="887" font-size="19" fill="#edf2ff">Recipient's deemed-export refund credit is for refund facilitation.</text><text x="46" y="921" font-size="19" fill="#edf2ff">Section 17 restrictions do not apply to this special credit.</text><text x="46" y="955" font-size="19" fill="#edf2ff">Exclude it from Net ITC under Rules 89(4) and 89(5).</text><text x="46" y="989" font-size="19" fill="#edf2ff">Supplier and recipient cannot both claim the same refund.</text><rect x="24" y="1030" width="752" height="99" rx="16" fill="#17233c" stroke="#425476"/><text x="46" y="1066" font-size="25" font-weight="700" fill="#9fc6ff">MEMORY HOOK</text><text x="46" y="1102" font-size="19" fill="#edf2ff">ATM analogy: cash increases, another asset decreases.</text></g></svg>